name: XAUUSD Forex Gold Scalper & Signal Broadcaster

on:
  schedule:
    # Runs every 15 minutes across Asian (01:00-04:45 UTC), London (07:00-11:45 UTC), and NY (12:00-19:45 UTC) Mon-Fri
    - cron: '*/15 1-4,7-11,12-19 * * 1-5'
  workflow_dispatch:
    inputs:
      timeframe:
        description: 'Trading Style / Timeframe'
        required: true
        default: 'scalp'
        type: choice
        options:
          - scalp
          - intraday
          - swing
      force:
        description: 'Force send alert (bypasses session check and price cooldown)'
        required: false
        default: false
        type: boolean

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Gold Scalp Signal Engine
        run: |
          python3 gold_signal.py --timeframe "${{ github.event.inputs.timeframe || 'scalp' }}"

      - name: Scan Best Currency Setups & Intermarket Confluence
        run: |
          python3 currency_scanner.py

      - name: Generate Weekly Recommendation History & Audit Report
        run: |
          python3 trade_history.py

      - name: Broadcast to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEFRAME: ${{ github.event.inputs.timeframe || 'scalp' }}
          FORCE_ARG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          python3 telegram_gold_signal.py --timeframe "$TIMEFRAME" $FORCE_ARG
