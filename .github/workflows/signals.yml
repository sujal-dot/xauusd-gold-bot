name: XAUUSD Forex Gold Institutional SMC Signal Broadcaster

on:
  schedule:
    # Runs every 5 minutes from 10:00 AM to 10:00 PM IST (04:30 to 16:30 UTC), Monday to Friday
    - cron: '30-55/5 4 * * 1-5'   # 04:30 - 04:55 UTC (10:00 AM - 10:25 AM IST)
    - cron: '*/5 5-15 * * 1-5'    # 05:00 - 15:55 UTC (10:30 AM - 09:25 PM IST)
    - cron: '0-30/5 16 * * 1-5'   # 16:00 - 16:30 UTC (09:30 PM - 10:00 PM IST)
  workflow_dispatch:
    inputs:
      timeframe:
        description: 'Trading Style / Timeframe'
        required: true
        default: 'smc'
        type: choice
        options:
          - smc
          - intraday
          - swing
          - scalp
      force:
        description: 'Force send alert (bypasses session check and price cooldown)'
        required: false
        default: false
        type: boolean

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure Config Directory Exists
        run: mkdir -p ~/.gemini/config

      - name: Restore Signal State Cache
        uses: actions/cache@v4
        with:
          path: ~/.gemini/config/forex_signal_state.json
          key: signal-state-${{ github.run_id }}
          restore-keys: |
            signal-state-

      - name: Fast 5-Minute Spot Gold SMC Check & Telegram Broadcast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEFRAME: ${{ github.event.inputs.timeframe || 'smc' }}
          FORCE_ARG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
          NOTIFY_WAIT: 'true'
        run: |
          python3 telegram_gold_signal.py --timeframe "$TIMEFRAME" $FORCE_ARG
