name: XAUUSD Forex Gold Scalper & Signal Broadcaster

on:
  schedule:
    # Runs every 5 minutes across Asian, London, and NY trading sessions Mon-Fri
    - cron: '*/5 0-21 * * 1-5'
    # Runs every 5 minutes during Sunday evening Asian market open (22:00-23:55 UTC)
    - cron: '*/5 22-23 * * 0'
  workflow_dispatch:
    inputs:
      timeframe:
        description: 'Trading Style / Timeframe'
        required: true
        default: 'scalp'
        type: choice
        options:
          - scalp
          - intraday
          - swing
      force:
        description: 'Force send alert (bypasses session check and price cooldown)'
        required: false
        default: false
        type: boolean

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure Config Directory Exists
        run: mkdir -p ~/.gemini/config

      - name: Restore Signal State Cache
        uses: actions/cache@v4
        with:
          path: ~/.gemini/config/forex_signal_state.json
          key: signal-state-${{ github.run_id }}
          restore-keys: |
            signal-state-

      - name: Fast 5-Minute Spot Gold Scalp Check & Telegram Broadcast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEFRAME: ${{ github.event.inputs.timeframe || 'scalp' }}
          FORCE_ARG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          python3 telegram_gold_signal.py --timeframe "$TIMEFRAME" $FORCE_ARG
